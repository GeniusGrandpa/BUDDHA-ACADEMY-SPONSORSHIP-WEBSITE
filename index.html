<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buddha Academy</title>
    <meta name="description" content="Providing free education to underprivileged children in Nepal since 1977" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f26b1d" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://*.supabase.co https://js.stripe.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com https://m.stripe.com https://m.stripe.network https://js.stripe.com https://hooks.stripe.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self' https://rc-epay.esewa.com.np https://epay.esewa.com.np; manifest-src 'self' blob:" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/index.css" />
    <script>
      (function(){
        try {
          var cached = JSON.parse(localStorage.getItem('ba_branding_cache') || 'null');
          if (cached) {
            if (cached.title) document.title = cached.title;
            if (cached.favicon) {
              var link = document.querySelector('link[rel="icon"]') || document.createElement('link');
              link.rel = 'icon';
              link.href = cached.favicon;
              if (!link.parentNode) document.head.appendChild(link);
            }
            if (cached.themeColor) {
              var meta = document.querySelector('meta[name="theme-color"]');
              if (meta) meta.content = cached.themeColor;
            }
            if (cached.ogImage) {
              var og = document.querySelector('meta[property="og:image"]') || document.createElement('meta');
              og.setAttribute('property', 'og:image');
              og.content = cached.ogImage;
              if (!og.parentNode) document.head.appendChild(og);
            }
            if (cached.appleTouchIcon) {
              var at = document.querySelector('link[rel="apple-touch-icon"]') || document.createElement('link');
              at.rel = 'apple-touch-icon';
              at.href = cached.appleTouchIcon;
              if (!at.parentNode) document.head.appendChild(at);
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
